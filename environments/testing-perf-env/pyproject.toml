[project]
name = "testing-perf-env"
version = "0.1.0"
description = "Neutral multi-turn testing and performance environment."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/testing_perf_env",
]

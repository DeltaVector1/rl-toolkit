[project]
name = "nemotron-reasoning-v1"
version = "0.1.0"
description = "Nemotron reasoning taskset (reasoning_gym + math + science + arc_agi) with the anti-hacking guardrail."
tags = ["nemotron", "reasoning", "math", "reasoning-gym", "arc-agi", "llm-judge", "v1"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "nemotron-guard-v1",
    "datasets",
    "huggingface-hub",
    "math-verify",
    "reasoning-gym",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nemotron_reasoning_v1"]

[tool.uv.sources]
nemotron-guard-v1 = { workspace = true }

output_dir = "/data/glm52-rl/runs/glm52-1"
max_steps = 200
dist_timeout_seconds = 5400
enable_router_replay = true

[parity_guard]
max_unmasked_mismatch_kl = 0.1
max_masked_mismatch_kl = 0.5
max_masked_fraction = 0.06

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "prod-run"
name = "trainer-glm52-1"
group = "glm52-decensor-r32"
tags = ["glm-5.2", "native-fp8", "lora-r32", "full-expert-lora", "pp8", "cp8", "ep8", "64x4090", "b1024", "g16", "32768", "lr8e-6", "production"]

[file_monitor]
filename = "run_glm52-1/trainer-metrics.jsonl"

[model]
name = "/data/glm52-rl/model-fp8"
impl = "custom"
freeze_moe_router = true
seq_len = 32768
attn = "flash_attention_2"
cp = 8
pp = 8
pp_transfer_sparse_indices = true
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
native_fp8_expert_prefetch = false
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
fp8_embed_head = false
fp8_lm_head = false
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
diagnose_linear_backward = false
expert_activation_transport = "int4"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = ["q_a_proj", "q_b_proj", "kv_a_proj_with_mqa", "kv_b_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "shared_expert", "experts"]

[model.ac]
mode = "reentrant_attention_all_experts"
freq = 1

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

[env_vars]
# Match the trainer-only stability gate. The launcher treats these GLM pins as
# authoritative; Muse configs do not define them and retain their defaults.
PRIME_INT4_COMBINE_ROUNDS = "8"
PRIME_FP8_EXPERT_ACTIVATION_OFFLOAD = "0"

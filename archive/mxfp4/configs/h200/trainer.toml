output_dir = "/data/glm52-rl/runs"
max_steps = 500
dist_timeout_seconds = 7200

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "glm52-decensor"
name = "glm52-decensor-h200-r32"
group = "glm52-decensor-r32"
tags = ["glm-5.2", "decensor", "grpo", "mxfp4", "lora-r32", "h200"]

[file_monitor]
filename = "trainer-metrics.jsonl"

[model]
name = "/data/glm52-rl/model"
impl = "custom"
seq_len = 65536
attn = "flash_attention_2"
cp = 2
cp_style = "ring"
ep = 8
dp_replicate = 1
ep_comm_backend = "deepep"
deepep_num_sms = 20
deepep_token_chunk_size = 16384
fsdp_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 4096
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "mxfp4"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_a_proj",
    "q_b_proj",
    "kv_a_proj_with_mqa",
    "o_proj",
]

[model.ac]
mode = "full"
freq = 1

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "zmq"
host = "127.0.0.1"
port = 29620
hwm = 16

[ckpt]
interval = 5
weights_only = false
resume_step = -1
skip_gather_master_weights = true
keep_last = 2
keep_interval = 100
output_dir = "/data/glm52-rl/runs/run_decensor_fast"

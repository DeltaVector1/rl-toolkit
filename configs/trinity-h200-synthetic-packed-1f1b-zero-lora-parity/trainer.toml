# Repeat packed batch-8 1f1b with fresh production LoRA and the same base reference.
# Live use requires all-rank B-zero, finite, and scale evidence; see ideas.md.

output_dir = "/data/glm52-rl/qualifications/trinity-h200-synthetic-packed-1f1b-zero-lora-parity/packed-1f1b-zero-lora-run"
max_steps = 1
dist_timeout_seconds = 5400
enable_router_replay = true

[data.fake]
batch_size = 8
generate_samples = false
reference_path = "/data/glm52-rl/qualifications/trinity-h200-synthetic-packed-parity/packed-reference.json"

[parity_guard]
max_unmasked_mismatch_kl = 0.1
max_masked_mismatch_kl = 0.5
max_masked_fraction = 0.06

[log]
level = "info"
ranks_filter = [0]

[file_monitor]
filename = "trainer-metrics.jsonl"

[model]
name = "/data/trinity-thinking-fp8"
impl = "custom"
seq_len = 32768
attn = "flash_attention_2"
cp = 8
cp_style = "ulysses"
pp = 8
pp_schedule = "1f1b"
pp_boundary_plan = "balanced"
pp_transfer_sparse_indices = false
reshard_after_forward = true
ep = 8
global_ep = false
ep_comm_backend = "torch"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
expert_activation_transport = "bf16"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
    "shared_expert",
    "experts",
]

[model.ac]
mode = "reentrant_attention_all_experts"
freq = 1

[optim]
type = "muon"
lr = 0.0
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

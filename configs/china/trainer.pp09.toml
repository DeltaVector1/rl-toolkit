output_dir = "/data/glm52-rl/runs/pp09"
max_steps = 2
dist_timeout_seconds = 1800
enable_router_replay = true

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "prod-run"
name = "trainer-pptest"
group = "glm52-decensor-r32"
tags = ["glm-5.2", "decensor", "grpo", "bf16-base", "lora-r32", "64x4090", "b1024", "4096", "cp4", "router-replay", "sparse-ada", "norm-adv", "expert-ac"]

[file_monitor]
filename = "run_pp09/trainer-metrics.jsonl"

[model]
name = "/data/glm52-rl/model-fp8"
impl = "custom"
seq_len = 4096
attn = "flash_attention_2"
cp = 4
pp = 7
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
ac_offloading = "None"
fp8_embed_head = false
fp8_lm_head = false
compile = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = true

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_a_proj",
    "q_b_proj",
    "kv_a_proj_with_mqa",
    "o_proj",
]

[model.ac]
mode = "selective"
freq = 1
targets = ["attention", "routed_experts"]

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "zmq"
host = "10.92.20.82"
port = 29620
hwm = 16

[ckpt]
interval = 25
weights_only = true
skip_gather_master_weights = true
keep_last = 2
keep_interval = 100
output_dir = "/data/glm52-rl/runs/pp09/run_pp09"

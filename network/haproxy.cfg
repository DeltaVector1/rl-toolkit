global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend h200_rollouts
    bind 0.0.0.0:8000
    default_backend h200_rollouts_backend

backend h200_rollouts_backend
    balance leastconn
    server h200_a 127.0.0.1:18001 check
    server h200_b 127.0.0.1:18002 check

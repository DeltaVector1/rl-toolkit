output_dir = "/data/glm52-rl/runs/x85"
max_steps = 20
dist_timeout_seconds = 5400
enable_router_replay = false

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "glm-runs"
name = "trainer-x85"
group = "glm-runs"
tags = ["x85", "glm-5.2", "lora-r32", "production", "20-step"]

[file_monitor]
filename = "run_x85/trainer-metrics.jsonl"

[model]
name = "/data/ZiphuAI/GLM-5.2-FP8"
impl = "custom"
seq_len = 32768
attn = "flash_attention_2"
cp = 8
pp = 8
pp_transfer_sparse_indices = true
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
fp8_embed_head = false
fp8_lm_head = false
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
dequantize_checkpoint_linears = false
dequantize_checkpoint_moe = false
diagnose_linear_backward = false
expert_activation_transport = "int4"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = ["q_a_proj", "q_b_proj", "kv_a_proj_with_mqa", "o_proj", "experts", "shared_expert"]

[model.ac]
mode = "reentrant_attention_shared_expert"
freq = 1

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

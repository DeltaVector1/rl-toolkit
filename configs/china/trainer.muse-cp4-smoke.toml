output_dir = "/data/muse-glimmer/runs/muse-cp4-smoke"
max_steps = 1
dist_timeout_seconds = 5400

[data.fake]
batch_size = 16
generate_samples = false

[log]
level = "debug"
ranks_filter = [0]

[file_monitor]
filename = "trainer-metrics.jsonl"

[model]
name = "/data/muse-glimmer/model"
impl = "auto"
seq_len = 65536
attn = "flash_attention_2"
cp = 4
cp_style = "ring"
pp = 8
ep = 1
dp_replicate = 1
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fused_lm_head_token_chunk_size = 512
compile = "None"
ac_offloading = "None"

[model.ac]
mode = "full"
freq = 1

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"
save_sharded = true

[rollout_transport]
type = "filesystem"

enable_lora = true
max_loras = 1
max_cpu_loras = 2
max_lora_rank = 32
lora_target_modules = [
  "q_a_proj",
  "q_b_proj",
  "kv_a_proj_with_mqa",
  "kv_b_proj",
  "o_proj",
  "gate_proj",
  "up_proj",
  "down_proj",
  "shared_expert",
  "experts",
]
gpu_memory_utilization = 0.92
enable_prefix_caching = true
enable_expert_parallel = false
enable_eplb = false
enable_return_routed_experts = true
api_server_count = 1

[server]
host = "0.0.0.0"
port = 8000
liveness_timeout_seconds = 120.0

[log]
level = "info"

[model]
name = "/models/glm52-fp8"
dtype = "bfloat16"
max_model_len = 32769
reasoning_parser = "glm45"
tool_call_parser = "glm47"

[parallel]
tp = 8
dp = 1

[weight_broadcast]
type = "filesystem"

[env_vars]
PRIME_LORA_CACHE_DIR = "/data/glm52-rl/lora-cache"
PRIME_PARITY_DIAGNOSTICS = "1"
PRIME_PARITY_DIAGNOSTIC_TOKENS = "256"
PRIME_PARITY_DIAGNOSTIC_MAX_FILES = "64"
PRIME_PARITY_DIAGNOSTIC_MAX_BYTES = "100000000"
PRIME_PARITY_ENGINE = "1"
PRIME_PARITY_QUALIFICATION_ROOT = "/data/glm52-rl/qualifications/glm52-policy-parity"
VLLM_WORKER_MULTIPROC_METHOD = "spawn"
NCCL_SOCKET_IFNAME = "eth0"

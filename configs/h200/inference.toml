enable_lora = true
max_loras = 1
max_cpu_loras = 2
max_lora_rank = 128
lora_target_modules = [
    "q_a_proj",
    "q_b_proj",
    "kv_a_proj_with_mqa",
    "o_proj",
]
gpu_memory_utilization = 0.92
enable_prefix_caching = true
enable_expert_parallel = true
enable_eplb = false
# The trainer discards routed_experts when enable_router_replay=false
# (train.py:571), yet it was still 95.5% of every response on the wire:
# 711 bytes for each generated token, 2.79 MB for each rollout.
enable_return_routed_experts = false
api_server_count = 1

[server]
host = "0.0.0.0"
port = 8000
liveness_timeout_seconds = 120.0

[log]
level = "info"

[model]
name = "/data/glm52-rl/model-fp8"
dtype = "bfloat16"
max_model_len = 32768
reasoning_parser = "glm45"
tool_call_parser = "glm47"

[parallel]
tp = 8
dp = 1

[weight_broadcast]
type = "filesystem"

[env_vars]
PRIME_LORA_CACHE_DIR = "/data/glm52-rl/lora-cache"
VLLM_WORKER_MULTIPROC_METHOD = "spawn"
NCCL_SOCKET_IFNAME = "eth0"

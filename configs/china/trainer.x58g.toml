output_dir = "/data/glm52-rl/runs/x58g"
max_steps = 1
dist_timeout_seconds = 5400
enable_router_replay = false

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "prod-run"
name = "trainer-x58g"
group = "glm52-decensor-r32"
tags = ["glm-5.2", "pp8", "decensor", "grpo", "native-fp8-base", "lora-r32", "64x4090", "b1024", "32768", "cp8", "zero-lr-gate", "reentrant-block-ac"]

[file_monitor]
filename = "run_x58g/trainer-metrics.jsonl"

[model]
name = "/data/glm52-rl/model-fp8"
impl = "custom"
seq_len = 32768
attn = "flash_attention_2"
cp = 8
pp = 8
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
fp8_embed_head = false
fp8_lm_head = false
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
dequantize_checkpoint_linears = false
dequantize_checkpoint_moe = false
diagnose_linear_backward = false

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_a_proj",
    "q_b_proj",
    "kv_a_proj_with_mqa",
    "o_proj",
]

[model.ac]
mode = "reentrant_block"
freq = 1

[optim]
type = "muon"
lr = 0.0
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

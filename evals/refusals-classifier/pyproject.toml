[project]
name = "refusals-classifier-eval"
version = "0.1.0"
description = "Refusal classifier evaluation environment and runtime."
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "verifiers>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refusals_classifier_eval_v1"]

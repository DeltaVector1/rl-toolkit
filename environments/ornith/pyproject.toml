[project]
name = "ornith-environment"
version = "0.1.0"
description = "Ornith curriculum environment."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ornith_curriculum_v1",
]

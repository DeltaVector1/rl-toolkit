global
    maxconn 4096

defaults
    mode http
    timeout connect 10s
    timeout check 5s
    timeout client 3600s
    timeout server 3600s
    retries 3
    option redispatch

frontend muse_h200b
    bind 127.0.0.1:17901
    default_backend muse_h200b_tunnels

frontend muse_h200a
    bind 127.0.0.1:17902
    default_backend muse_h200a_tunnels

backend muse_h200b_tunnels
    balance leastconn
    option httpchk GET /v1/models
    http-check expect status 200
    default-server check inter 5s fall 1 rise 1
    server b01 127.0.0.1:18001
    server b03 127.0.0.1:18003
    server b05 127.0.0.1:18005
    server b07 127.0.0.1:18007

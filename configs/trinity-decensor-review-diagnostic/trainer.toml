# Hugging Face revision: 6412c1ad1588c664977b0f830b80a20273173318

# Before restart, require the no-clobber gate: this exact run path must be
# absent on every configured trainer, orchestrator, and H200 host.
output_dir = "/data/glm52-rl/runs/trinity-decensor-experimental-fixed-diag-d29a5958"
max_steps = 1
dist_timeout_seconds = 5400
enable_router_replay = true

[log]
level = "info"
ranks_filter = [0]

[parity_guard]
max_unmasked_mismatch_kl = 0.1
max_masked_mismatch_kl = 0.5
max_masked_fraction = 0.06

[swanlab]
project = "trinity-runs-review-diagnostic"
name = "trainer-trinity-decensor-experimental-fixed-diag-d29a5958"
group = "trinity-decensor-experimental-fixed-diag-d29a5958"
tags = ["trinity-thinking", "decensor", "grpo", "lora-r32", "batch32", "review-diagnostic", "run-trinity-decensor-experimental-fixed-diag-d29a5958", "refusal-primary", "parity-guard"]
mode = "online"

[file_monitor]
filename = "run_trinity-decensor-experimental-fixed-diag-d29a5958/trainer-metrics.jsonl"

[model]
name = "/data/trinity-thinking-fp8"
impl = "custom"
seq_len = 32768
attn = "flash_attention_2"
cp = 8
cp_style = "ulysses"
pp = 8
pp_schedule = "1f1b"
pp_boundary_plan = "balanced"
reshard_after_forward = true
ep = 8
global_ep = false
ep_comm_backend = "torch"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
expert_activation_transport = "bf16"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
    "shared_expert",
    "experts",
]

[model.ac]
mode = "reentrant_attention_all_experts"
freq = 1

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

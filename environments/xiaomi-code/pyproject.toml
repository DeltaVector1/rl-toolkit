[project]
name = "xiaomi-code"
version = "0.1.0"
description = "Xiaomi MiMo released Code tasks and executable-test verifier"
requires-python = ">=3.11"
dependencies = ["verifiers", "xiaomi-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xiaomi_code"]

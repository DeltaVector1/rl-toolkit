[hosts]
trainer_head = "n82"
trainer_ssh = "china-trainer"
trainers = ["n76", "n77", "n78", "n80", "n82", "n83", "n84", "n85"]
trainer_internal_addresses = { n76 = "10.92.20.76", n77 = "10.92.20.77", n78 = "10.92.20.78", n80 = "10.92.20.80", n82 = "10.92.20.82", n83 = "10.92.20.83", n84 = "10.92.20.84", n85 = "10.92.20.85" }
inference = ["h200a"]
orchestrator = "h200a"
metrics = ["h200a", "n82"]
blocked = ["n79"]

[ports]
inference_tunnel_first = 18001
inference_tunnel_last = 18048
judge = 26406
adapter = 8100
adapter_tunnel = 18100
glm_adapter = 8101
glm_adapter_tunnel_first = 18200
glm_adapter_tunnel_last = 18207
batch = 29620
h200_parity_backend = 8100

[paths]
remote_repository = "/data/glm52-rl/deployment-glm52-optims"
glm52_qualification_repository = "/data/glm52-rl/deployment-glm52-optims"
runs = "/data/glm52-rl/runs"
glm_adapter_root = "/data/glm52-rl"
glm_adapter_tunnel_state = "/data/glm52-rl/glm-adapter-tunnels.json"
adapter_bucket = "hf://buckets/NewEden/muse-lora-checkpoints"

[containers]
trainer = "glm52-optims-trainer"
glm52_qualification_trainer = "glm52-optims-trainer"
trainer_image = "prime-rl:glm52-v080-qual"
inference_image = "prime-rl:glm52-v080-full"
orchestrator = "glm52-optims-orchestrator"
environment = "glm52-optims-env-train"
glm52_inference = "glm52-optims-h200"
glm52_adapter_server = "glm52-optims-adapter-gzip"
glm52_pp_async_cuda_smoke = "glm52-pp-async-cuda-smoke"
muse_inference = "muse-glimmer-h200"
glm52_model_volume = "glm52-fp8-model"

[isolation]
protected_repository = "/data/glm52-rl/deployment"
protected_trainer = "glm52-decensor-trainer"
protected_orchestrator = "glm52-decensor-orchestrator"
protected_inference = ["muse-glimmer-h200-0", "glm52-decensor-h200"]

[models]
glm52 = "/models/glm52-fp8"
muse = "/data/muse-glimmer/model"

[inference.h200a.muse]
gpu_count = 8
tensor_parallel_size = 1
ports = [8001, 8002, 8003, 8004, 8005, 8006, 8007, 8008]

[inference.h200a.glm52]
gpu_count = 8
tensor_parallel_size = 8
ports = [8000]

[profiles.current]
kind = "glm52"
trainer_container = "trainer"
trainer = "configs/paused/trainer.glm52-production.toml"
orchestrator = "configs/paused/orchestrator.glm52-production.toml"
environment = "configs/paused/env.glm52-production.toml"

[profiles.glm52-native-small]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-small.toml"

[profiles.glm52-policy-parity]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-policy-parity-trainer.toml"

[profiles.glm52-native-b2048]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-b2048.toml"

[profiles.glm52-native-b2048-memory]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-b2048-memory.toml"
launch_env = { PRIME_CUDA_MEMORY_CAPTURE = "1", PRIME_CUDA_MEMORY_CAPTURE_RANK = "0", PRIME_CUDA_MEMORY_CAPTURE_STEP = "1", PRIME_CUDA_MEMORY_CAPTURE_PATH = "/data/glm52-rl/qualifications/glm52-native-b2048-memory/cuda-memory-capture.json", PRIME_BF16_COMBINE_ROUNDS = "8" }

[profiles.glm52-native-b2048-nsys]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-b2048-nsys.toml"
launch_env = { PRIME_NSYS_PROFILE = "1", PRIME_CUDA_PROFILE = "1", PRIME_CUDA_PROFILE_RANK = "24", PRIME_CUDA_PROFILE_STEPS = "2", PRIME_PHASE_PROFILE_RECORD_PATH = "/data/glm52-rl/qualifications/glm52-native-b2048-nsys-20260827/phase-profile.json" }

[profiles.glm52-native-delta3]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-delta3.toml"

[profiles.glm52-native-stability20]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-stability20.toml"

[profiles.glm52-native-pp-async]
kind = "glm52"
trainer_container = "glm52_qualification_trainer"
trainer = "configs/qualification/glm52-native-pp-async.toml"

[qualification.glm52_pp_async_cuda]
kind = "glm52"
host = "n82"
container = "glm52_pp_async_cuda_smoke"
script = "source/tests/test_pp_async_cuda.py"
output_root = "/data/glm52-rl/qualifications/glm52-pp-async-cuda-smoke"
steps = 2
gpus = 8
transport = "glm52_trainer"

[transport.glm52_trainer]
network_mode = "host"
process_group_timeout_seconds = 5400
device_id = "local_rank"

[transport.glm52_trainer.env]
CUDA_DEVICE_ORDER = "PCI_BUS_ID"
PYTHONUNBUFFERED = "1"
OMP_NUM_THREADS = "1"
NCCL_SOCKET_IFNAME = "vlan130"
GLOO_SOCKET_IFNAME = "vlan130"
NCCL_IB_DISABLE = "1"
NCCL_P2P_DISABLE = "1"
NCCL_SOCKET_NTHREADS = "1"
NCCL_NSOCKS_PERTHREAD = "1"
NCCL_BUFFSIZE = "1048576"
NCCL_CUMEM_HOST_ENABLE = "0"
NCCL_MIN_NCHANNELS = "16"
NCCL_MAX_NCHANNELS = "16"
TORCH_NCCL_TRACE_BUFFER_SIZE = "1048576"
TORCH_NCCL_DUMP_ON_TIMEOUT = "1"
TORCH_NCCL_ASYNC_ERROR_HANDLING = "1"
TORCH_NCCL_ENABLE_MONITORING = "1"
TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC = "600"

[reward]
minimum_steps = 10
spread_multiplier = 2.0
reference_run = "x22"
reference_spread = 0.039

[limits]
stall_seconds = 600
final_steps = 50
h200_engine_startup_grace_seconds = 7200
h200_parity_listener_stabilization_seconds = 30

[limits.glm52_qualification]
evidence_max_age_seconds = 86400
session_duration_seconds_max = 14400
forward_backward_seconds_max = 900
peak_memory_gib_max = 46.0
b2048_session_duration_seconds_max = 3600
b2048_startup_seconds_max = 900
b2048_profiler_finalize_seconds_max = 120

[limits.h200_parity_cleanup]
settle_timeout_seconds = 120
poll_seconds = 2

[limits.h200_parity_failure_evidence]
state_poll_seconds = 2
inspect_max_bytes = 65536
logs_max_bytes = 262144
events_max_bytes = 65536

[limits.live_service_check]
attempts = 2
connect_timeout_seconds = 45
command_timeout_seconds = 49
retry_delay_seconds = 1
workers = 7
trainer_budget_seconds = 210
inference_budget_seconds = 105

[parity.glm52]
fixture = "/data/glm52-rl/qualifications/glm52-policy-parity/fixture"
h200_capture = "/data/glm52-rl/qualifications/glm52-policy-parity/h200-capture-final"
trainer_stage = "/data/glm52-rl/qualifications/glm52-policy-parity/trainer-stage-final"

[gate.glm52_step20_h200]
profile = "configs/qualification/glm52-step20-h200.toml"
result = "/data/glm52-rl/qualifications/glm52-step20-h200/result.json"
adapter = "/data/glm52-rl/qualifications/glm52-step20-h200/adapter-step20"
qualification_result = "/data/glm52-rl/qualifications/glm52-step20-h200/adapter-step20/.qualification-result.json"
trainer_adapter = "/data/glm52-rl/qualifications/glm52-native-stability20/run_trainer_only/broadcasts/step_20/adapter_model.safetensors"

[requirements.shared]
group_size = 16
max_output_length = 16384
learning_rate = 8e-6
max_gradient_norm = 1.0
weight_decay = 0.0

[requirements.muse]
batch_size = 1024
context_length = 65536
trainer_seconds_max = 480
rollout_seconds_max = 1200

[requirements.glm52]
batch_size = 2048
context_length = 32768
trainer_seconds_min = 600
trainer_seconds_max = 900
rollout_seconds_min = 480
rollout_seconds_max = 720

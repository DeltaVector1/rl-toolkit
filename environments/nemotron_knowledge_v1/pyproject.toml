[project]
name = "nemotron-knowledge-v1"
version = "0.1.0"
description = "Nemotron knowledge taskset (mcqa + qa_abstention) with the anti-hacking guardrail."
tags = ["nemotron", "knowledge", "mcqa", "qa", "llm-judge", "v1"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "nemotron-guard-v1",
    "datasets",
    "huggingface-hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nemotron_knowledge_v1"]

[tool.uv.sources]
nemotron-guard-v1 = { workspace = true }

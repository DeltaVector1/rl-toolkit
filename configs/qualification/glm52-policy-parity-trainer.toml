output_dir = "/data/glm52-rl/qualifications/glm52-policy-parity/trainer"
max_steps = 1
dist_timeout_seconds = 5400
enable_router_replay = false
enable_token_export = true

[data.fake]
batch_size = 8
generate_samples = false
reference_path = "/data/glm52-rl/qualifications/glm52-policy-parity/trainer-stage-final/trainer-reference.json"

[log]
level = "info"
ranks_filter = [0]

[file_monitor]
filename = "trainer-metrics.jsonl"

[model]
name = "/data/ZiphuAI/GLM-5.2-FP8"
impl = "custom"
freeze_moe_router = true
seq_len = 32768
attn = "flash_attention_2"
cp = 8
pp = 8
pp_schedule = "1f1b"
pp_transfer_sparse_indices = true
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
native_fp8_expert_prefetch = false
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
fp8_embed_head = false
fp8_lm_head = false
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
diagnose_linear_backward = false
expert_activation_transport = "int4"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = ["q_a_proj", "q_b_proj", "kv_a_proj_with_mqa", "kv_b_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "shared_expert", "experts"]

[model.ac]
mode = "reentrant_attention_all_experts"
freq = 1

[optim]
type = "muon"
lr = 0.0
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

[env_vars]
PRIME_PARITY_ROUTER_TRACE_DIR = "/data/glm52-rl/qualifications/glm52-policy-parity/trainer-traces"
PRIME_PARITY_QUALIFICATION_ROOT = "/data/glm52-rl/qualifications/glm52-policy-parity"
PRIME_PARITY_ROUTER_TRACE_SOURCE = "/data/glm52-rl/qualifications/glm52-policy-parity/trainer-stage-final/trainer-router-trace"
PRIME_PARITY_TRACE_MAX_CALLS = "600"
PRIME_PARITY_TRACE_MAX_FILES = "600"
PRIME_PARITY_TRACE_MAX_BYTES = "400000000"
PRIME_PARITY_DIAGNOSTICS = "1"
PRIME_PARITY_DIAGNOSTIC_TOKENS = "256"
PRIME_PARITY_DIAGNOSTIC_MAX_FILES = "64"
PRIME_PARITY_DIAGNOSTIC_MAX_BYTES = "100000000"

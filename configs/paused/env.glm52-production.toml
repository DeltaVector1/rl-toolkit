output_dir = "/data/glm52-rl/runs/glm52-1/run_glm52-1/env"

[log]
level = "info"

[env]
max_concurrent_agents = 1

[env.taskset]
id = "decensor-v1"
dataset_name = "/data/glm52-rl/decensor-data/rl.jsonl"
num_examples = 2000

[env.taskset.task.judge]
base_url = "http://202.214.223.66:26406/v1"
model = "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
api_key_var = "VLLM_API_KEY"

[env.taskset.task.user]
base_url = "http://202.214.223.66:26406/v1"
model = "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
api_key_var = "VLLM_API_KEY"

[env.assistant]
max_output_tokens = 16384

[env.assistant.harness]
id = "null"

[env.assistant.timeout]
rollout = 3600

[serve]
address = "tcp://127.0.0.1:5000"
max_concurrent = 8

[serve.pool]
type = "static"
num_workers = 16

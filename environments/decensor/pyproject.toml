[project]
name = "decensor-environments"
version = "0.1.0"
description = "Decensor reinforcement-learning environment."
tags = ["multi-turn", "v1"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "datasets",
]

[project.scripts]
decensor-offline-sweep = "decensor_v1.offline_sweep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/decensor_v1",
]

[project]
name = "nemotron-guard-v1"
version = "0.1.0"
description = "Shared nemotron anti-hacking guardrail (hard-zero gates + LLM judges) as v1 helpers."
tags = ["nemotron", "guardrail", "anti-hacking", "llm-judge", "v1"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nemotron_guard_v1"]

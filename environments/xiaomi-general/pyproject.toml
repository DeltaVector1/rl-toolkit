[project]
name = "xiaomi-general"
version = "0.1.0"
description = "Native Verifiers tasks for Xiaomi General"
requires-python = ">=3.11"
dependencies = ["verifiers", "xiaomi-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xiaomi_general"]

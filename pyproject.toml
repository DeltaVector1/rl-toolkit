[project]
name = "xiaomi-rl-environments"
version = "0.1.0"
description = "Released Xiaomi MiMo RL verifiers ported to native Verifiers v1"
requires-python = ">=3.11,<3.15"
dependencies = ["xiaomi-code", "xiaomi-general", "xiaomi-music"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["environments/*"]

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "bf2834cac27d882b6edc9388835791a395361954" }
xiaomi-code = { workspace = true }
xiaomi-general = { workspace = true }
xiaomi-music = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

output_dir = "/data/glm52-rl/runs/x84p"
max_steps = 200
dist_timeout_seconds = 5400
enable_router_replay = false

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "prod-run"
name = "trainer-x84p"
group = "glm52-decensor-r32"
tags = ["glm-5.2", "pp8", "decensor", "grpo", "native-fp8-base", "lora-r32", "lora-shared-expert", "64x4090", "b1024", "32768", "cp8", "lr8e-6", "production", "fp8-forward-backward", "int4-ep", "balanced-pp", "sparse-cache", "shared-expert-ac", "fp8-act-offload", "fp8-live-set", "inplace-ep", "bwd-2k", "fail-closed-rollouts", "lora-reconcile", "stream-fp8-bwd", "stream-int4-a2a", "int4-a2a-r8"]

[file_monitor]
filename = "run_x84p/trainer-metrics.jsonl"

[model]
name = "/data/glm52-rl/model-fp8"
impl = "custom"
seq_len = 32768
attn = "flash_attention_2"
cp = 8
pp = 8
pp_transfer_sparse_indices = true
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
fp8_embed_head = false
fp8_lm_head = false
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
dequantize_checkpoint_linears = false
dequantize_checkpoint_moe = false
diagnose_linear_backward = false
expert_activation_transport = "int4"

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
target_modules = ["q_a_proj", "q_b_proj", "kv_a_proj_with_mqa", "o_proj", "shared_expert"]

[model.ac]
mode = "reentrant_attention_shared_expert"
freq = 1

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

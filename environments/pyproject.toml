[project]
name = "decensor-environments"
version = "0.1.0"
description = "Verifiers environments and held-out evaluation metrics for this project."
tags = ["multi-turn", "evaluation", "v1"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/decensor_v1",
    "src/ornith_curriculum_v1",
    "src/refusals_classifier_eval_v1",
]

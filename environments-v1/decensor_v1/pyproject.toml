[project]
name = "decensor-v1"
version = "0.1.0"
description = "Decensor (multi-turn refusal-reduction) with a multiplicative judge/length reward, ported to the v1 API."
tags = ["multi-turn", "judge", "safety", "v1"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "datasets",
    "huggingface-hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decensor_v1"]

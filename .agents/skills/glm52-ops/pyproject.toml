[project]
name = "glm52-ops"
version = "1.0.0"
description = "Status, reward analysis, repair, and launch control for the GLM-5.2 decensor GRPO run"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
glm52-ops = "glm52_ops:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

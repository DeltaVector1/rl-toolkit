[project]
name = "training-ops"
version = "1.0.0"
description = "Status, reward analysis, repair, and launch control for the training run"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
training-ops = "training_ops:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

output_dir = "/data/glm52-rl/qualifications/glm-cp8-ep-profile-1"
max_steps = 1
dist_timeout_seconds = 5400
enable_router_replay = false

[env_vars]
PRIME_FP8_EXPERT_ACTIVATION_OFFLOAD = "0"
PRIME_LORA_MM_PROFILE = "sm89-r32"
prime_sparse_bwd_skip_sentinel = "1"
PRIME_EP_PROFILE = "1"
PRIME_EP_PROFILE_EVERY = "150"

[parity_guard]
max_unmasked_mismatch_kl = 0.1
max_masked_mismatch_kl = 0.5
max_masked_fraction = 0.06

[log]
level = "debug"
ranks_filter = [0]

[swanlab]
project = "glm-runs"
name = "trainer-glm-cp8-ep-profile-1"
group = "glm-runs"
tags = ["glm-cp8-ep-profile-1", "glm-5.2", "fp8", "ep-profile", "lora-r32"]

[file_monitor]
filename = "trainer-metrics.jsonl"

[model]
name = "/data/ZiphuAI/GLM-5.2-FP8"
impl = "custom"
freeze_moe_router = true
seq_len = 32768
attn = "flash_attention_2"
cp = 8
pp = 8
pp_schedule = "1f1b"
pp_transfer_sparse_indices = true
pp_limit_receive_buffers = true
pp_boundary_plan = "explicit"
pp_layer_boundaries = [0, 8, 18, 28, 38, 48, 58, 69, 78]
cp_style = "ring"
ep = 8
global_ep = false
dp_replicate = 1
ep_comm_backend = "torch"
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
native_fp8_expert_prefetch = false
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
moe_router_dtype = "float32"
moe_use_grouped_mm = true
fused_lm_head_token_chunk_size = 1024
fp8_embed_head = false
fp8_lm_head = false
compile = "None"
ac_offloading = "None"

[model.quantization]
type = "fp8"
dequantize_checkpoint = false
diagnose_linear_backward = false
fused_qkv_a_fp8 = true
expert_activation_transport = "bf16_forward_fp8_local_recompute_backward"
w8a16_modules = []

[model.lora]
rank = 32
alpha = 64
dropout = 0.0
freeze_a = true
initial_adapter_path = "/data/glm52-rl/runs/glm52-rank32-initial-adapter/adapter_model.safetensors"
target_modules = ["q_a_proj", "q_b_proj", "kv_a_proj_with_mqa", "kv_b_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "shared_expert", "experts"]

[model.ac]
mode = "reentrant_attention_all_experts"
freq = 1
keep_routed_expert_activations_from_pp_stage = 5

[optim]
type = "muon"
lr = 8e-6
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"

[rollout_transport]
type = "filesystem"

[data]

[data.fake]
batch_size = 46

[project]
name = "xiaomi-common"
version = "0.1.0"
description = "Pinned Xiaomi RL dataset loading for native Verifiers tasksets"
requires-python = ">=3.11"
dependencies = ["verifiers", "huggingface-hub>=0.24", "pyarrow>=18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xiaomi_common"]

# Keep fake-data qualification outside the RL run-discovery root. The cluster
# launcher writes torchrun logs under /data/glm52-rl/runs; if this output used
# the same directory, MultiRunManager would mistake the log folder for a live
# orchestrator run and wait for control/orch.toml.
output_dir = "/data/glm52-rl/qualifications/muse-q1"
max_steps = 20
dist_timeout_seconds = 5400
enable_router_replay = false

[data.fake]
# PP8 x CP4 leaves DP2. A global value of 42 gives 21 packed microbatches
# per DP group, which matches the successful Muse production step.
batch_size = 42
generate_samples = true
ce_only = true

[log]
level = "debug"
ranks_filter = [0]

[file_monitor]
filename = "trainer-metrics.jsonl"

[model]
name = "/data/muse-glimmer/model"
impl = "auto"
seq_len = 65536
attn = "flash_attention_2"
cp = 4
cp_style = "ring"
pp = 8
ep = 1
dp_replicate = 1
fsdp_cpu_offload = false
cold_cpu_offload = false
optim_cpu_offload = false
reshard_after_forward = true
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fused_lm_head_token_chunk_size = 512
compile = "None"
ac_offloading = "None"

[model.lora]
rank = 128
alpha = 256.0
dropout = 0.0
target_modules = [
    'model\.language_model\.layers\.[0-9]+\.self_attn\.(q_proj|k_proj|v_proj|o_proj|gate_proj)$',
    'model\.language_model\.layers\.[0-9]+\.mlp\.(gate_proj|up_proj|down_proj)$',
]
modules_to_save = []

[model.ac]
mode = "full"
freq = 1

[optim]
type = "muon"
lr = 0.0
weight_decay = 0.0
max_norm = 1.0

[scheduler]
type = "constant"

[weight_broadcast]
type = "filesystem"
save_format = "safetensors"
save_sharded = false

[rollout_transport]
type = "filesystem"

[ckpt]
interval = 25
keep_last = 1
keep_interval = 100
weights_only = true
skip_gather_master_weights = true

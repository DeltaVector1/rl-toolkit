[project]
name = "decensor-experimental-environments"
version = "0.1.0"
description = "Experimental decensor reinforcement-learning environment."
tags = ["multi-turn", "v1", "experimental"]
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.2.0",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/decensor_experimental_v1",
]
